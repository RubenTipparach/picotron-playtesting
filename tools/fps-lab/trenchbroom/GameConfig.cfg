{
    "version": 9,
    "name": "Picotron FPS Lab",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Standard" },
        { "format": "Valve" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".zip", "format": "zip" }
    },
    "materials": {
        "root": "textures",
        "extensions": [".png"]
    },
    "entities": {
        "definitions": [ "fpslab.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [],
        "brushface": [
            { "name": "Clip", "attribs": [ "transparent" ], "match": "material", "pattern": "clip" },
            { "name": "Skip", "attribs": [ "transparent" ], "match": "material", "pattern": "skip" }
        ]
    },
    "faceattribs": {
        "defaults": { "scale": [2.0, 2.0] },
        "contentflags": [],
        "surfaceflags": []
    }
}
