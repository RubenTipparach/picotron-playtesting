# Build the playtesting site (+ any Picotron carts under carts/) and deploy
# it to GitHub Pages.
#
# Picotron carts (carts/<name>.p64) are exported headlessly to HTML using a
# private Linux Picotron build supplied through the PICOTRON_ZIP secret
# (pipeline ported from RubenTipparach/picotron-build-demo). When the secret
# is missing the cart step is skipped with a warning and the rest of the site
# still builds/deploys.
name: Build and Deploy to Pages

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress production deploys.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Picotron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb unzip libsdl2-2.0-0 libfreetype6 ca-certificates curl

      - name: Fetch Picotron from secret
        id: picotron
        env:
          # A download URL (recommended) or base64 of the Linux Picotron zip.
          PICOTRON_ZIP: ${{ secrets.PICOTRON_ZIP }}
        run: |
          if [[ -z "$PICOTRON_ZIP" ]]; then
            echo "::warning::PICOTRON_ZIP secret is not set - Picotron carts in carts/ will NOT be built."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            bash scripts/picotron/fetch-picotron.sh
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export Picotron carts to HTML
        if: steps.picotron.outputs.available == 'true'
        run: bash scripts/picotron/build-all-carts.sh

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    # Only publish from main; branches/PRs build (and export carts) as a check.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
